version: '3'
tasks:
  default: { cmds: [{ task: help }] }
  help:    { desc: "This list",                                   cmds: [task --list], silent: true }
  list:    { desc: "Skills and symlink status per agent folder",  cmds: [bin/list] }
  link:    { desc: "Add missing symlinks, remove stale ones",     cmds: [bin/link] }
  update:  { desc: "git pull, then link",                         cmds: [git pull --ff-only, bin/link] }
